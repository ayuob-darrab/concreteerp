; ============================================
; مثال إعدادات OPcache لـ ConcreteERP (Laragon / php.ini)
; انسخ المناسب إلى php.ini ثم أعد تشغيل Apache/PHP
; مرجع: خطة-تطوير / 01-opcache
; ============================================

zend_extension=opcache

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; التطوير: إعادة تحميل عند تغيير الملفات
opcache.validate_timestamps=1
opcache.revalidate_freq=2
; الإنتاج: عادة validate_timestamps=0 مع نشر منظم
